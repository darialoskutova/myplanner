<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171314">
  <title>Мой календарь</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Russo+One&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-collage" aria-hidden="true">
        <span class="sidebar-seven">7</span>
        <span class="sidebar-tape"></span>
      </div>

      <div class="mini-calendar">
        <div class="mini-head">
          <button class="icon-btn" id="miniPrev" aria-label="Предыдущий месяц">←</button>
          <strong id="miniTitle"></strong>
          <button class="icon-btn" id="miniNext" aria-label="Следующий месяц">→</button>
        </div>
        <div class="mini-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
        <div class="mini-grid" id="miniGrid"></div>
      </div>

      <nav class="side-nav" aria-label="Навигация">
        <button class="side-link active" data-view="day"><span>☀</span> Сегодня</button>
        <button class="side-link" data-view="week"><span>▦</span> Моя неделя</button>
        <button class="side-link" data-view="month"><span>○</span> Весь месяц</button>
      </nav>

      <div class="punk-label" aria-hidden="true">
        <span>NO RULES</span><span>JUST PLANS</span>
      </div>
    </aside>

    <main class="main">
      <div class="edge-art edge-art-cards" aria-hidden="true"></div>
      <div class="edge-art edge-art-lotus" aria-hidden="true"></div>
      <img class="crow crow-perched" src="./crow-collage-cutout.png" alt="" aria-hidden="true">
      <img class="crow crow-flying" src="./crow-flying-cutout.png" alt="" aria-hidden="true">

      <header class="topbar">
        <h1 id="pageTitle">Доброе утро!</h1>
        <div class="header-actions">
          <div class="view-switch" role="group" aria-label="Вид календаря">
            <button class="view-btn active" data-view="day">День</button>
            <button class="view-btn" data-view="week">Неделя</button>
            <button class="view-btn" data-view="month">Месяц</button>
          </div>
          <button class="today-btn" id="todayBtn">Сегодня</button>
        </div>
      </header>

      <section class="moodboard" aria-label="Коллаж в стиле NANA">
        <div class="mood-copy">
          <span class="issue">ISSUE № 07</span>
          <p>Every day<br>is a new page.</p>
        </div>
        <div class="scrap scrap-paper" aria-hidden="true"></div>
        <div class="scrap scrap-zebra" aria-hidden="true"></div>
        <div class="scrap scrap-stickers" aria-hidden="true"></div>
        <div class="scrap scrap-portrait" aria-hidden="true"></div>
        <div class="scrap scrap-collage" aria-hidden="true"></div>
        <div class="punk-stamp" aria-hidden="true">LIVE<br>LOUD</div>
        <span class="tape tape-one" aria-hidden="true"></span>
        <span class="tape tape-two" aria-hidden="true"></span>
      </section>

      <section class="date-nav">
        <button class="round-btn" id="prevBtn" aria-label="Назад">←</button>
        <div>
          <h2 id="dateHeading"></h2>
          <p id="dateSubheading"></p>
        </div>
        <button class="round-btn" id="nextBtn" aria-label="Вперёд">→</button>
      </section>

      <section id="calendarView" aria-live="polite"></section>

      <section class="notes-card">
        <div class="notes-head">
          <div>
            <p class="eyebrow">МЫСЛИ И ИДЕИ</p>
            <h2>Заметки на день</h2>
          </div>
          <span id="noteSaved">Сохранено</span>
        </div>
        <textarea id="notes" placeholder="Запишите важную мысль, идею или напоминание…"></textarea>
      </section>

      <p class="footer-note">LOVE × MUSIC × DREAMS <span>★</span></p>
    </main>
  </div>

  <button class="fab" id="addTaskBtn" aria-label="Добавить задачу">＋ <span>Добавить задачу</span></button>

  <dialog id="taskDialog">
    <form id="taskForm">
      <div class="modal-head">
        <div><p class="eyebrow">НОВАЯ ЗАДАЧА</p><h2 id="modalTitle">Запланировать</h2></div>
        <button class="icon-btn close-btn" type="button" id="closeDialog" aria-label="Закрыть">×</button>
      </div>
      <input type="hidden" id="taskId">
      <label>Название<input id="taskTitle" maxlength="80" placeholder="Например, тренировка" required></label>
      <div class="form-row">
        <label>Дата<input id="taskDate" type="date" required></label>
        <label>Время<select id="taskTime"></select></label>
      </div>
      <label class="repeat-check">
        <input id="taskRepeat" type="checkbox">
        <span class="check-ui"></span>
        <span><strong>Повторять каждый день</strong><small>Задача будет закреплена на это время</small></span>
      </label>
      <div class="modal-actions">
        <button class="delete-btn" id="deleteTask" type="button">Удалить</button>
        <button class="cancel-btn" id="cancelDialog" type="button">Отмена</button>
        <button class="save-btn" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
